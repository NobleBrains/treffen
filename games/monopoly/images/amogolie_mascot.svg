<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="hatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="crewGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Blue Amogus / Monopoly Crewmate Body -->
    <path d="M 65 140 C 65 80 175 80 175 140 L 175 200 C 175 210 160 210 150 200 L 140 185 L 100 185 L 90 200 C 80 210 65 210 65 200 Z" 
          fill="url(#crewGrad)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Backpack -->
    <rect x="42" y="115" width="26" height="65" rx="10" 
          fill="#1d4ed8" stroke="#0f172a" stroke-width="6"/>

    <!-- Shiny Visor -->
    <ellipse cx="128" cy="130" rx="38" ry="22" 
             fill="url(#visorGrad)" stroke="#0f172a" stroke-width="5"/>
    <ellipse cx="120" cy="123" rx="18" ry="8" 
             fill="#ffffff" opacity="0.75"/>

    <!-- Monocle on Visor -->
    <circle cx="145" cy="130" r="16" fill="none" stroke="#eab308" stroke-width="4"/>
    <!-- Monocle Chain -->
    <path d="M 160 134 Q 175 155 168 180" fill="none" stroke="#eab308" stroke-width="2.5" stroke-dasharray="3,2"/>

    <!-- Classic Monopoly Mustache -->
    <path d="M 120 160 C 105 155 90 162 82 170 C 88 172 102 170 115 165 C 120 163 125 163 130 165 C 143 170 157 172 163 170 C 155 162 140 155 125 160 Z" 
          fill="#ffffff" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Red Bowtie -->
    <polygon points="105,180 120,185 105,190" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
    <polygon points="135,180 120,185 135,190" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
    <circle cx="120" cy="185" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>

    <!-- Elegant Black Top Hat (Tilted) -->
    <g transform="rotate(-12 120 80)">
      <!-- Hat Crown -->
      <path d="M 85 85 L 92 25 L 148 25 L 155 85 Z" 
            fill="url(#hatGrad)" stroke="#0f172a" stroke-width="5.5" stroke-linejoin="round"/>
      <!-- Hat Red Band -->
      <path d="M 86 73 L 88 85 L 152 85 L 154 73 Z" 
            fill="#dc2626" stroke="#0f172a" stroke-width="3"/>
      <!-- Hat Gold Buckle -->
      <rect x="114" y="72" width="12" height="14" rx="2" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
      <rect x="117" y="75" width="6" height="8" rx="1" fill="#dc2626"/>
      <!-- Hat Brim -->
      <ellipse cx="120" cy="85" rx="52" ry="12" 
               fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    </g>
  </g>
</svg>
